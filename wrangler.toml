# Cloudflare Pages — static root + Functions under /functions
# Project name on dash: agent-office-web
name = "agent-office-web"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."

# Create KV in the dashboard (or: npx wrangler kv namespace create OFFICE_EVENTS)
# then paste the id below and bind the same name in:
#   Pages → agent-office-web → Settings → Functions → KV namespace bindings
#   Variable name: EVENTS
#
# [[kv_namespaces]]
# binding = "EVENTS"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# Secret (dashboard → Settings → Environment variables / Secrets):
#   INGEST_TOKEN = long random string (used by bridge POST only)
