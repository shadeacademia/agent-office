<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A tiny animated agent office — mock workers, real vibes." />
    <title>Agent Office</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121a2f'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%237c9cff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>Agent Office</h1>
        <span class="sub">v1 mock sim · no backend · Cloudflare Pages ready</span>
      </div>
      <div class="topbar-actions">
        <span id="clock"></span>
        <button type="button" id="btn-nudge" title="Send a random agent back to work">
          Nudge agent
        </button>
      </div>
    </header>

    <main class="layout">
      <section class="stage-wrap">
        <div class="stage-label">
          <span id="office-name">Office</span>
          <span>Live floor</span>
        </div>
        <div class="floor-scroll">
          <div id="floor" aria-label="Office floor plan"></div>
        </div>
      </section>

      <aside class="side">
        <section class="panel">
          <h2>Roster</h2>
          <div id="roster"></div>
        </section>
        <section class="panel" style="flex: 1">
          <h2>Activity</h2>
          <div id="feed"></div>
        </section>
      </aside>
    </main>

    <footer class="footer">
      Static demo · open via HTTP · deploy output dir <code>/</code> · no build step
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
